<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="820" height="460" role="img" aria-labelledby="title desc">
  <title id="title">Utkarsh Wadalkar system identity</title>
  <desc id="desc">Animated neofetch terminal showing Utkarsh's education, focus, tools, projects, and career interests.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&amp;display=swap');
      .font { font-family: 'Fira Code', 'JetBrains Mono', 'Consolas', monospace; font-size: 12px; }
      .ascii { font-family: 'Fira Code', 'JetBrains Mono', 'Consolas', monospace; font-size: 10px; font-weight: 700; }
      .user { fill: #58a6ff; font-weight: 700; }
      .symbol { fill: #8b949e; }
      .command { fill: #00ff87; font-size: 13px; font-weight: 700; }
      .heading { fill: #58a6ff; font-size: 13.5px; font-weight: 700; }
      .divider { fill: #30363d; }
      .key { fill: #ffd700; font-weight: 700; }
      .value { fill: #e6edf3; }
      .cursor { fill: #00ff87; }
    </style>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <clipPath id="command-clip">
      <rect x="138" y="-14" width="0" height="22">
        <animate attributeName="width" values="0;0;68;68;0" keyTimes="0;.05;.2;.88;1" dur="10s" repeatCount="indefinite" />
      </rect>
    </clipPath>
    <clipPath id="output-reveal">
      <rect x="20" y="84" width="770" height="0">
        <animate attributeName="height" values="0;0;310;310;0" keyTimes="0;.2;.32;.88;1" dur="10s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <g class="font">
    <rect x="16" y="16" width="790" height="430" rx="10" fill="#010409" opacity=".68" />
    <rect x="10" y="10" width="790" height="430" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
    <rect x="10" y="10" width="790" height="36" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <rect x="11" y="32" width="788" height="14" fill="#161b22" />

    <circle cx="32" cy="28" r="6" fill="#ff5f56" />
    <circle cx="52" cy="28" r="6" fill="#ffbd2e" />
    <circle cx="72" cy="28" r="6" fill="#27c93f" />
    <text x="405" y="32" fill="#8b949e" font-size="11.5" font-weight="700" text-anchor="middle">utkarsh@ai-lab: ~ (neofetch)</text>

    <g transform="translate(35 68)">
      <text><tspan class="user">utkarsh@ai-lab</tspan><tspan class="symbol">:~$ </tspan></text>
      <text x="138" class="command" clip-path="url(#command-clip)">neofetch</text>
      <rect x="138" y="-13" width="7.5" height="16" class="cursor">
        <animate attributeName="x" values="138;138;206;206;138" keyTimes="0;.05;.2;.88;1" dur="10s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="1;0;1;1;0;0" keyTimes="0;.03;.05;.2;.21;1" dur="10s" repeatCount="indefinite" />
      </rect>
    </g>

    <g clip-path="url(#output-reveal)">
      <g class="ascii" xml:space="preserve" filter="url(#soft-glow)">
        <text x="35" y="130" fill="#ffd700">██╗   ██╗████████╗██╗  ██╗</text>
        <text x="35" y="146" fill="#ffd700">██║   ██║╚══██╔══╝██║ ██╔╝</text>
        <text x="35" y="162" fill="#e0af68">██║   ██║   ██║   █████╔╝ </text>
        <text x="35" y="178" fill="#e0af68">██║   ██║   ██║   ██╔═██╗ </text>
        <text x="35" y="194" fill="#58a6ff">╚██████╔╝   ██║   ██║  ██╗</text>
        <text x="35" y="210" fill="#58a6ff"> ╚═════╝    ╚═╝   ╚═╝  ╚═╝</text>
      </g>

      <g fill="none" stroke-linecap="round">
        <path d="M68 252H120L145 230H210 M68 278H145L168 300H226 M92 326H138L158 346H218" stroke="#30363d" stroke-width="2" />
        <path d="M68 252H120 M145 230H210 M68 278H145 M168 300H226 M92 326H138 M158 346H218" stroke="#ffd700" stroke-width="1.5" stroke-dasharray="30 90">
          <animate attributeName="stroke-dashoffset" values="120;0" dur="3s" repeatCount="indefinite" />
        </path>
        <g fill="#00ff87" stroke="none">
          <circle cx="68" cy="252" r="4" /><circle cx="210" cy="230" r="4" />
          <circle cx="68" cy="278" r="4" /><circle cx="226" cy="300" r="4" />
          <circle cx="92" cy="326" r="4" /><circle cx="218" cy="346" r="4" />
        </g>
      </g>
      <text x="145" y="380" fill="#8b949e" text-anchor="middle" font-size="10.5">learn → build → ship → iterate</text>

      <g>
        <text x="320" y="102" class="heading">utkarsh@ai-lab</text>
        <text x="320" y="114" class="divider">----------------------------------------------------</text>

        <text x="320" y="132"><tspan class="key">OS: </tspan><tspan class="value">Windows 11 // Linux</tspan></text>
        <text x="320" y="151"><tspan class="key">Host: </tspan><tspan class="value">B.E. AI &amp; Data Science @ Zeal College</tspan></text>
        <text x="320" y="170"><tspan class="key">Kernel: </tspan><tspan class="value">Applied AI // Full-Stack Engineering</tspan></text>
        <text x="320" y="189"><tspan class="key">Uptime: </tspan><tspan class="value">Lifetime learner [always iterating]</tspan></text>
        <text x="320" y="208"><tspan class="key">Shell: </tspan><tspan class="value">PowerShell 7 // Bash</tspan></text>
        <text x="320" y="227"><tspan class="key">Terminal: </tspan><tspan class="value">VS Code // Codex</tspan></text>
        <text x="320" y="246"><tspan class="key">Focus: </tspan><tspan class="value">AI Engineering &amp; Intelligent Automation</tspan></text>
        <text x="320" y="265"><tspan class="key">Stack: </tspan><tspan class="value">Python, FastAPI, React, Electron</tspan></text>
        <text x="320" y="284"><tspan class="key">ML Ops: </tspan><tspan class="value">Docker, DVC, AWS S3, GitHub Actions</tspan></text>
        <text x="320" y="303"><tspan class="key">Current: </tspan><tspan class="value">Audora // KaushalVaani // TeachBack</tspan></text>
        <text x="320" y="322"><tspan class="key">Open to: </tspan><tspan class="value">AI internships // Real-world collaborations</tspan></text>
        <text x="320" y="341"><tspan class="key">Creed: </tspan><tspan class="value">"Real problems -&gt; useful systems"</tspan></text>

        <g transform="translate(320 366)">
          <rect width="20" height="12" rx="2" fill="#1a1b26" />
          <rect x="24" width="20" height="12" rx="2" fill="#f7768e" />
          <rect x="48" width="20" height="12" rx="2" fill="#9ece6a" />
          <rect x="72" width="20" height="12" rx="2" fill="#e0af68" />
          <rect x="96" width="20" height="12" rx="2" fill="#7aa2f7" />
          <rect x="120" width="20" height="12" rx="2" fill="#bb9af7" />
          <rect x="144" width="20" height="12" rx="2" fill="#7dcfff" />
          <rect x="168" width="20" height="12" rx="2" fill="#c0caf5" />
          <rect y="16" width="20" height="12" rx="2" fill="#414868" />
          <rect x="24" y="16" width="20" height="12" rx="2" fill="#ff9e64" />
          <rect x="48" y="16" width="20" height="12" rx="2" fill="#73daca" />
          <rect x="72" y="16" width="20" height="12" rx="2" fill="#b4f9f8" />
          <rect x="96" y="16" width="20" height="12" rx="2" fill="#2ac3de" />
          <rect x="120" y="16" width="20" height="12" rx="2" fill="#cfc9c2" />
          <rect x="144" y="16" width="20" height="12" rx="2" fill="#9aa5ce" />
          <rect x="168" y="16" width="20" height="12" rx="2" fill="#ffffff" />
        </g>
      </g>
    </g>

    <g transform="translate(35 418)">
      <animate attributeName="visibility" values="hidden;hidden;visible;visible;hidden" keyTimes="0;.32;.33;.88;1" dur="10s" repeatCount="indefinite" />
      <text><tspan class="user">utkarsh@ai-lab</tspan><tspan class="symbol">:~$ </tspan></text>
      <rect x="138" y="-13" width="7.5" height="16" class="cursor">
        <animate attributeName="opacity" values="1;0;1;0;1;0;1" dur="2s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>
</svg>
